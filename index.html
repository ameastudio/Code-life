<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0758e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Code Life">
  <meta name="description" content="Code Life — learn coding through Code City with your own evolving code pet.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./v4.css">
  <link rel="stylesheet" href="./v5-backgrounds.css">
  <title>Code Life</title>
</head>
<body>
  <div class="app-shell">
    <header class="hud" aria-label="Code Life status">
      <button class="brand" type="button" data-route="lessons" aria-label="Open Code City">
        <span class="brand-mark" aria-hidden="true"><span>&lt;/&gt;</span></span>
        <span class="brand-word"><b>Code</b><strong>Life</strong></span>
      </button>

      <div class="hud-stats">
        <div class="xp-stat" aria-label="Experience points"><b>XP</b><span id="xp-amount">0</span></div>
        <div class="coin-stat" aria-label="Code Coins"><span class="gold-coin" aria-hidden="true"></span><span id="coin-amount">0</span></div>
        <div class="streak-stat" aria-label="Learning streak">
          <svg class="cyber-flame" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="flameGradient" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0a49dd"/><stop offset=".55" stop-color="#1da8ff"/><stop offset="1" stop-color="#7ee8ff"/></linearGradient></defs><path fill="url(#flameGradient)" d="M13.2 2.2c.7 3.6-2.3 4.8-1.1 7.1.6 1.1 1.9 1.2 2.8.4 1.2-1 1.2-2.8.8-4 3 2.4 5.1 5.4 4.7 9-.5 4.3-4 7.3-8.4 7.3-4.8 0-8.6-3.2-8.6-7.9 0-3.5 2.1-6.4 5.2-8.7-.1 2.7.5 4.6 2 5.4-.4-3.8 1-6.4 2.6-8.6Z"/><path fill="#d8f7ff" d="M12.4 12.1c.3 1.7-1.2 2.5-.5 3.7.4.7 1.2.8 1.8.3.6-.5.7-1.4.5-2.1 1.5 1.2 2.4 2.6 2.2 4.1-.2 1.8-1.8 3.1-4.1 3.1-2.4 0-4-1.4-4-3.5 0-1.5.9-2.8 2.4-3.9 0 1.2.3 2 .9 2.4-.2-1.8.3-3 1-4.1Z"/></svg>
          <span id="streak-amount">0</span>
        </div>
        <button id="settings-button" class="settings-button" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="M19 13.3v-2.6l2-1.5-2-3.4-2.4 1a8 8 0 0 0-2.2-1.3L14.1 3h-4.2l-.3 2.5a8 8 0 0 0-2.2 1.3l-2.4-1-2 3.4 2 1.5v2.6l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 2.2 1.3l.3 2.5h4.2l.3-2.5a8 8 0 0 0 2.2-1.3l2.4 1 2-3.4-2-1.5Z"/></svg>
        </button>
      </div>
      <div class="hud-xp-track" aria-hidden="true"><i id="hud-xp-fill"></i></div>
    </header>

    <main id="app" class="page"><div class="loading">Lighting up Code City…</div></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button type="button" data-nav="lessons" class="active" aria-label="Lessons and Code City">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9l4-4 4 4v11M12 20V6l4-3 4 3v14M2 20h20M7 12h2m-2 3h2m6-5h2m-2 3h2"/></svg><span>Lessons</span>
      </button>
      <button type="button" data-nav="courses" aria-label="Courses">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4-8 4-8-4 8-4Zm-6 8 6 3 6-3m-12 5 6 3 6-3"/></svg><span>Courses</span>
      </button>
      <button type="button" data-nav="playground" aria-label="Playground">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4m8-8 4 4-4 4M14 5l-4 14"/></svg><span>Playground</span>
      </button>
      <button type="button" data-nav="progress" aria-label="Progress">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11m7 9V5m7 15v-6M3 20h18"/></svg><span>Progress</span>
      </button>
      <button type="button" data-nav="pet" aria-label="My Pet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.4 10.7c-2 .3-3.4 1.8-3.4 3.7 0 2.8 2.8 4.6 7 4.6s7-1.8 7-4.6c0-1.9-1.4-3.4-3.4-3.7M7 8.5c-1.1 0-2-1.1-2-2.5s.9-2.5 2-2.5 2 1.1 2 2.5S8.1 8.5 7 8.5Zm10 0c-1.1 0-2-1.1-2-2.5s.9-2.5 2-2.5 2 1.1 2 2.5-.9 2.5-2 2.5Zm-5-1c-1.1 0-2-1.1-2-2.5s.9-2.5 2-2.5 2 1.1 2 2.5-.9 2.5-2 2.5Z"/></svg><span>My Pet</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="reward-fx" aria-hidden="true"></div>

  <script>window.CODE_LIFE_V4=true;</script>
<script src="./curriculum.js"></script>
  <script src="./app.js"></script>
<script src="./v4.js"></script>
  <script src="./v5-backgrounds.js"></script>
</body>
</html>
