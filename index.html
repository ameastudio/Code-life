<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef5ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Code Life">
  <meta name="description" content="Code Life — a playful, bite-sized coding journey through Code City.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Code Life</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button class="brand" data-route="lessons" aria-label="Code Life home">
        <span class="brand-mark">&lt;/&gt;</span>
        <span><b>Code</b><strong>Life</strong></span>
      </button>
      <div class="header-stats">
        <span class="coin-pill" id="coin-pill">◉ 0</span>
        <span class="streak-pill" id="streak-pill">✦ 0</span>
      </div>
    </header>

    <main id="app" class="page">
      <div class="loading">Booting Code City…</div>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-nav="lessons" class="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Zm16 0A2.5 2.5 0 0 0 17.5 3H13v16h4.5A2.5 2.5 0 0 1 20 21.5v-16Z"/></svg>
        <span>Lessons</span>
      </button>
      <button data-nav="courses">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4-8 4-8-4 8-4Zm-6.5 8.5L12 15l6.5-3.5M5.5 16 12 20l6.5-4"/></svg>
        <span>Courses</span>
      </button>
      <button data-nav="playground">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4m8-8 4 4-4 4m-3-10-2 12"/></svg>
        <span>Playground</span>
      </button>
      <button data-nav="progress">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10m7 10V4m7 16v-7"/></svg>
        <span>Progress</span>
      </button>
      <button data-nav="pet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 10.5c-1.7.2-3 1.6-3 3.3 0 2.5 2.6 4.2 6.5 4.2s6.5-1.7 6.5-4.2c0-1.7-1.3-3.1-3-3.3M7 8.5c-1.1 0-2-1.1-2-2.5s.9-2.5 2-2.5 2 1.1 2 2.5S8.1 8.5 7 8.5Zm10 0c-1.1 0-2-1.1-2-2.5s.9-2.5 2-2.5 2 1.1 2 2.5-.9 2.5-2 2.5Zm-5-1c-1.1 0-2-1.1-2-2.5s.9-2.5 2-2.5 2 1.1 2 2.5-.9 2.5-2 2.5Z"/></svg>
        <span>My Pet</span>
      </button>
    </nav>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./curriculum.js"></script>
  <script src="./app.js"></script>
</body>
</html>
